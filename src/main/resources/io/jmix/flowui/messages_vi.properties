io.jmix.flowui.app.propertyfilter.dateinterval.component/NextLastIntervalField.includingCurrentHelperBtn.messageDialog.content=<div>\
  <p>\
     Tuỳ chọn "bao gồm hiện tại" không dịch chuyển khoảng kết quả. Ví dụ, nếu khoảng được chọn là hai ngày gần nhất và \
     không dùng "bao gồm hiện tại" cho ngày <code>'04-MM-yyyy'</code>, thì khoảng kết quả sẽ gồm:\
  </p>\
  <ul>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     Nếu ví dụ trên dùng tuỳ chọn "bao gồm hiện tại", khoảng kết quả sẽ gồm:\
  </p>\
  <ul>\
     <li>04-MM-yyyy;</li>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     Quy tắc tương tự áp dụng cho năm, tháng, giờ và phút.\
  </p>\
