io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.tooltipMessage=<div>Biểu thức JPQL sẽ được thêm vào \
  mệnh đề "from" của truy vấn data loader.<br/> \
  Có thể cần khi tạo điều kiện dựa trên thuộc tính của một tập hợp liên quan.<br><br> \
  Biểu thức phải bắt đầu bằng dấu phẩy, hoặc lệnh "join"/"left join".<br/>\
  Dùng ký hiệu {E} thay cho bí danh thực thể.<br><br>\
  Ví dụ:<br/>\
  <code>join {E}.tags t</code></div>
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.helperText=<div>Biểu thức phải bắt đầu bằng \
  dấu phẩy, "join" hoặc "left join". Ví dụ: </span><code>join {E}.tags t</code></div>
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.requiredMessage=Điền trường "Where"
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.tooltipMessage=<div>Biểu thức JPQL sẽ được thêm vào \
  mệnh đề "where" của truy vấn data loader. \
  Dùng ký hiệu {E} thay cho bí danh thực thể.<br><br>\
  Điều kiện chỉ được có một tham số, ký hiệu bằng <b>?</b> nếu sử dụng.<br/>\
  Ngoài ra có thể dùng các tham số dựng sẵn sau:<ul>\
  <li><code>:current_user_&lt;attribute&gt;</code> – thuộc tính của người dùng hiện tại.</li>\
  <li><code>:session_&lt;attribute&gt;</code> – thuộc tính phiên làm việc.</li></ul>\
  Nếu biểu thức dùng mệnh đề <code>like</code>, giá trị sẽ tự được bao trong <code>(?i)%value%</code> \
  để tìm kiếm không phân biệt hoa thường.<br/>\
  <br/>\
  Ví dụ chọn thực thể theo thuộc tính của tập hợp <code>tags</code> đã join:<br/>\
  <code>t.name like ?</code></div>

