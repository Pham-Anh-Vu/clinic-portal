io.jmix.reportsflowui.view.parameter/parameters.lookupJoinHelp.header=Mệnh đề Join
io.jmix.reportsflowui.view.parameter/parameters.lookupJoinHelp.text=<div>Giá trị trường này sẽ được thêm vào mệnh đề "from" của truy vấn. Nó phải bắt đầu bằng dấu phẩy, "join" hoặc "left join".\
  <br/>{E} là placeholder dùng làm bí danh của thực thể được trích xuất. Khi chạy truy vấn, nó sẽ được thay bằng bí danh thực tế chỉ định trong truy vấn.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>join {E}.seller s</code>\
  </div>
io.jmix.reportsflowui.view.parameter/parameters.lookupJoin.helperText=<div>Giá trị trường này sẽ được thêm vào mệnh đề "from" của truy vấn. \
  Nó phải bắt đầu bằng dấu phẩy, "join" hoặc "left join". Ví dụ: <code>join {E}.seller s</code></div>

