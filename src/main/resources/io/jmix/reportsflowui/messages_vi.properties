io.jmix.reportsflowui.view.report/parametersTab.validationFieldHelp.header=Tập lệnh xác thực
io.jmix.reportsflowui.view.report/parametersTab.validationFieldHelp.text=<div>Tại đây bạn có thể đặt Groovy script để kiểm tra giá trị tham số báo cáo.\
  <br/> Có thể dùng phương thức <code>showErrorMessage(String str)</code> để gửi thông điệp lỗi xác thực báo cáo tới người dùng.\
  <br/> Script cần kiểm tra giá trị tham số và gọi "showErrorMessage()" nếu giá trị không hợp lệ.\
  <br/>\
  <br/> Ví dụ, <code>showErrorMessage('Incorrect parameter')</code> tương ứng thông điệp gửi khi tham số không hợp lệ lúc chạy báo cáo.\
  <br/>\
  Các biến sau được truyền vào script:\
  <ul>\
  <li><code>value</code> - giá trị tham số người dùng nhập</li>\
  <li><code>dataManager</code> - đối tượng <code>DataManager</code> cung cấp chức năng CRUD</li>\
  <li><code>metadata</code> - đối tượng <code>Metadata</code> để truy cập metadata ứng dụng</li>\
  <li><code>currentAuthentication</code> - đối tượng <code>CurrentAuthentication</code> gắn với người dùng đang\
  <br/>đăng nhập</li>\
  <li><code>applicationContext</code> - đối tượng <code>ApplicationContext</code> để truy cập các bean được quản lý</li>\
  <li><code>showErrorMessage</code> - phương thức sẽ khiến xác thực thất bại nếu được gọi trong script</li>\
  </ul>\
  </div>

