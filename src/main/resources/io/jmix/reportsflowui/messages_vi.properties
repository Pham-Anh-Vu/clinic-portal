io.jmix.reportsflowui.view.parameter/parameters.lookupWhereHelp.header=Mệnh đề Where
io.jmix.reportsflowui.view.parameter/parameters.lookupWhereHelp.text=<div>Giá trị trường này sẽ được thêm vào mệnh đề "where" của truy vấn với điều kiện "and". Không cần từ "where" vì sẽ được tự động thêm.\
  <br/>{E} là placeholder dùng làm bí danh của thực thể được trích xuất. Khi chạy truy vấn, nó sẽ được thay bằng bí danh thực tế chỉ định trong truy vấn.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>{E}.salary > 1000 and {E}.department = 'abc'</code>\
  </div>

