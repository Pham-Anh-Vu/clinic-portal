io.jmix.reportsflowui.view.template/customDefinitionField.helpIcon.dialog.header=Mẫu Groovy
io.jmix.reportsflowui.view.template/customDefinitionField.helpIcon.dialog.content=\
<div>\
  Tại đây bạn có thể đặt Groovy script để tạo ra mẫu. Các biến sau sẽ được truyền vào script:\
  <ul>\
  <li><code>params</code> - các tham số báo cáo bên ngoài</li>\
  <li><code>rootBand</code> - dải gốc dưới dạng đối tượng <code>BandData</code></li>\
  <li><code>applicationContext</code> - đối tượng <code>ApplicationContext</code> để truy cập các bean được quản lý</li>\
  </ul>\
</div>

io.jmix.reportsflowui.view.template/outputNamePatternField.helpIcon.dialog.header=Mẫu tên tệp đầu ra
io.jmix.reportsflowui.view.template/outputNamePatternField.helpIcon.dialog.content=\
  <div>\
  Mẫu tên tệp tùy chọn sẽ được dùng khi tải báo cáo xuống. \
  Có thể là chuỗi cố định hoặc chứa tham số báo cáo dưới dạng biến, ví dụ: \
  <br/>\
  <br/><code>${header.authorName}.xlsx</code> \
  <br/>\
  <br/>Các mẫu phức tạp hơn với nhiều tham số và nối chuỗi cũng có thể \
  được tạo như một script trong bất kỳ dải nào của cấu trúc báo cáo, ví dụ: \
  <br/>\
  <br/><code>${Root.title}.xlsx</code> \
  <br/>\
  <br/>trong đó <code>title</code> là kết quả của script: \
  <br/>\
  <br/><code>[['title' : ('Report for ' + params['author'].firstName\
  <br/>+ ' ' + params['author'].lastName)]]</code> \
  </div>

