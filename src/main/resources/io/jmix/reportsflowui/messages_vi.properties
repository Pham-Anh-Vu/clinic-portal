io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonPathQueryTextAreaField.helpIcon.dialog.header=Tập lệnh
io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonPathQueryTextAreaField.helpIcon.dialog.content=<div>\
Tại đây bạn có thể đặt truy vấn JSON path để truy vấn cây JSON.\
  <p>Ví dụ:</p>\
  Với cấu trúc JSON sau, ta có thể chọn tất cả sách bằng truy vấn <strong>$.store.book[*]</strong>\
  <br>\
  <code>\
            {<br>\
             &nbsp "store": {<br>\
             &nbsp &nbsp "book": [<br>\
             &nbsp &nbsp &nbsp {<br>\
             &nbsp &nbsp &nbsp &nbsp "category": "reference",<br>\
             &nbsp &nbsp &nbsp &nbsp "author": "Nigel Rees",<br>\
             &nbsp &nbsp &nbsp &nbsp "title": "Sayings of the Century",<br>\
             &nbsp &nbsp &nbsp &nbsp "price": 8.95<br>\
             &nbsp &nbsp &nbsp },<br>\
             &nbsp &nbsp &nbsp {<br>\
             &nbsp &nbsp &nbsp &nbsp "category": "fiction",<br>\
             &nbsp &nbsp &nbsp &nbsp "author": "Evelyn Waugh",<br>\
             &nbsp &nbsp &nbsp &nbsp "title": "Sword of Honour",<br>\
             &nbsp &nbsp &nbsp &nbsp "price": 12.99,<br>\
             &nbsp &nbsp &nbsp &nbsp "isbn": "0-553-21311-3"<br>\
             &nbsp &nbsp &nbsp }<br>\
             &nbsp &nbsp ],<br>\
             &nbsp &nbsp "bicycle": {<br>\
             &nbsp &nbsp &nbsp "color": "red",<br>\
             &nbsp &nbsp &nbsp "price": 19.95<br>\
             &nbsp &nbsp }<br>\
             &nbsp }<br>\
            }<br>\
  </code>\
  <br>\
  Để biết thêm ví dụ nâng cao, vui lòng tham khảo tài liệu JSON path.\
</div>
io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonGroovyCodeEditor.helpIcon.dialog.header=Tập lệnh
io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonGroovyCodeEditor.label=Tập lệnh
io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonGroovyCodeEditor.helpIcon.dialog.content=<div>\
Tại đây bạn có thể đặt một Groovy script trả về chuỗi JSON. Các biến sau được truyền vào script:\
  <ul>\
  <li><code>params</code> - map tham số báo cáo bên ngoài</li>\
  <li><code>parentBand</code> - dải cha dưới dạng đối tượng kiểu <code>BandData</code></li>\
  <li><code>dataManager</code> - đối tượng <code>DataManager</code> cung cấp chức năng CRUD</li>\
  <li><code>metadata</code> - đối tượng <code>Metadata</code> để truy cập metadata của ứng dụng</li>\
  <li><code>currentAuthentication</code> - đối tượng <code>CurrentAuthentication</code> gắn với người dùng đang\
   xác thực</li>\
  <li><code>applicationContext</code> - đối tượng <code>ApplicationContext</code> để truy cập các bean được quản lý</li>\
  <li><code>timeSource</code> - đối tượng <code>TimeSource</code> dùng lấy thời gian hiện tại</li>\
  </ul>\
</div>
