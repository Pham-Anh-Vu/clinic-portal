io.jmix.reportsflowui.view.parameter/parameters.transformationScriptHelp.text=<div>Cho phép áp dụng Groovy script lên tham số trước khi dùng trong\
  <br/>báo cáo. Script phải trả về giá trị tham số mới. Giá trị hiện tại của tham số\
  <br/>có trong script với tên <code>paramValue</code>, map tham số có bí danh <code>params</code>.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>return "%" + paramValue + "%"</code>\
  </div>

