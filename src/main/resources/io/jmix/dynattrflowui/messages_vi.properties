io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScript=Groovy script nạp tuỳ chọn
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScriptHelp=<div>Cho phép nạp tuỳ chọn của thuộc tính động bằng Groovy script.\
  <br/>Script phải trả về danh sách tuỳ chọn. Thực thể có thuộc tính động khả dụng trong script \
  qua biến <code>entity</code>. Lưu ý biến <code>entity</code> có thể là <code>null</code> khi dùng trong \
  bộ lọc với thành phần danh sách thả xuống.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>return ['code_1', 'code_2', (entity ? entity.code : 'code_0')]</code></div>
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScript=SQL script nạp tuỳ chọn
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScriptHelp=<div>Cho phép nạp tuỳ chọn của thuộc tính động bằng SQL script.\
  <br/>Script phải trả về danh sách tuỳ chọn.\
  <br/>Giá trị thuộc tính động trong script khả dụng qua biến <code>entity</code>. Lưu ý biến <code>entity</code> \
  sẽ không được định nghĩa khi dùng trong bộ lọc với thành phần danh sách thả xuống.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>select street from db_Address e where e.strName = ${entity.+&lt;dynamicAttrCode&gt;}</code>\
  <br/>trong đó &lt;dynamicAttrCode&gt; là mã của thuộc tính động tương ứng</div>
io.jmix.dynattrflowui.view.categoryattr/joinClause=Mệnh đề JOIN
io.jmix.dynattrflowui.view.categoryattr/joinClauseHelp=<div>Giá trị của trường này sẽ được thêm vào mệnh đề truy vấn "from". Phải bắt đầu bằng dấu phẩy, "join" hoặc "left join".\
  <br/>Giá trị thuộc tính động trong script khả dụng qua biến <code>entity</code>:\
  <br/>${entity.+&lt;dynamicAttrCode&gt;}, trong đó &lt;dynamicAttrCode&gt; là mã thuộc tính động tương ứng. \
  <br/>Lưu ý biến <code>entity</code> sẽ không được định nghĩa khi dùng trong bộ lọc với thành phần danh sách thả xuống.\
  <br/>Ký hiệu giữ chỗ {E} được dùng làm bí danh của thực thể được trích xuất. Khi thực thi, {E} sẽ được thay bằng bí danh thật được chỉ định trong truy vấn.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>join {E}.seller s</code></div>
io.jmix.dynattrflowui.view.categoryattr/joinHelperText=<div>Giá trị của trường này sẽ được thêm vào mệnh đề truy vấn "from". \
  Phải bắt đầu bằng dấu phẩy, "join" hoặc "left join". Ví dụ: <code>join {E}.seller s</code></div>
io.jmix.dynattrflowui.view.categoryattr/whereClause=Mệnh đề WHERE
io.jmix.dynattrflowui.view.categoryattr/whereClauseHelp=<div>Giá trị của trường này sẽ được thêm vào mệnh đề truy vấn "where" bằng toán tử "and". Không cần viết từ "where", hệ thống sẽ tự thêm.\
  <br/>Ký hiệu giữ chỗ {E} dùng làm bí danh của thực thể được trích xuất. Khi thực thi, sẽ được thay bằng bí danh thật trong truy vấn.\
  <br/>Giá trị thuộc tính động trong script khả dụng qua biến <code>entity</code>. Lưu ý biến <code>entity</code> \
  sẽ không được định nghĩa khi dùng trong bộ lọc với thành phần danh sách thả xuống.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>{E}.salary > ${entity.+&lt;dynamicAttrCode&gt;} and {E}.department = 'abc'</code>\
  <br/>trong đó &lt;dynamicAttrCode&gt; là mã thuộc tính động tương ứng</div>
io.jmix.dynattrflowui.view.categoryattr/validationScript=Kiểm tra hợp lệ tuỳ chỉnh
io.jmix.dynattrflowui.view.categoryattr/validationScriptHelp=<div>Cho phép áp dụng Groovy script để kiểm tra tham số trước khi lưu.\
  <br/>Nếu kiểm tra không đạt, script phải trả về thông báo lỗi. Ngược lại \
  script không trả về giá trị hoặc trả về <code>null</code>. \
  <br/>Giá trị cần kiểm tra khả dụng trong script qua biến <code>value</code>. \
  Thông báo lỗi dùng chuỗi mẫu (template), có thể dùng khoá '${value}' để hiển thị định dạng.\
  <br/>\
  <br/>Ví dụ:\
  <br/><code>if (!value.startsWith("correctValue")) return "giá trị '\\${value}' không hợp lệ"</code></div>
io.jmix.dynattrflowui.view.categoryattr/recalculationScript=Script tính lại
io.jmix.dynattrflowui.view.categoryattr/recalculationScriptHelp=<div>Groovy script dùng để tính lại giá trị của tham số này.\
  <br/> Các biến được truyền vào script: \
  <br/>\
  <br/><code>entity</code> - thực thể đang chỉnh sửa \
  <br/>\
  <br/><code>dynamicAttributes</code> - bản đồ (map) trong đó khoá là mã thuộc tính, giá trị là giá trị thuộc tính động \
  <br/>\
  <br/>Ví dụ script tính lại dùng map dynamicAttributes: \
  <br/>\
  <br/><code>if (dynamicAttributes['PassengerNumberOfSeats'] > 9) return 'Bus' else return 'Passenger'</code> \
  <br/>\
  <br/>Ví dụ script tính lại dùng lớp EntityValues: \
  <br/>\
  <br/><code>import io.jmix.core.entity.EntityValues;\
  <br/>\
  <br/>if(EntityValues.getValue(entity,"+PassengerNumberofseats") > 9) return 'Bus' else return 'Passenger'</code> \
  <br/>\
  <br/>Mỗi khi một thuộc tính trong danh sách "Thuộc tính phụ thuộc vào" thay đổi, script sẽ được thực thi.</div>
io.jmix.dynattrflowui.view.categoryattr/entityViewAccessDeniedMessage=Không có quyền truy cập View thực thể. Hãy cấp quyền mở View.
io.jmix.dynattrflowui.view.categoryattr/targetViews=View đích

